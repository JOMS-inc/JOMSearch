# Terminates TLS for jomsearch.dk and reverse-proxies to the Go app.
# The Let's Encrypt cert lives on the server (/etc/letsencrypt) and is mounted read-only.

events { }

http {
    server {
        listen 80;
        server_name jomsearch.dk www.jomsearch.dk;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name jomsearch.dk www.jomsearch.dk;

        ssl_certificate /etc/letsencrypt/live/jomsearch.dk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jomsearch.dk/privkey.pem;

        # Grafana (monitoring.md). It is configured to live under /grafana/.
        # The name is looked up per request via Docker's DNS (127.0.0.11)
        # instead of at startup, so nginx (and the whole site) still starts
        # if the grafana container is down. The Upgrade headers are for
        # Grafana Live's websockets.
        location /grafana/ {
            resolver 127.0.0.11 valid=30s;
            set $grafana http://grafana:3000;
            proxy_pass $grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
        }

        location / {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
