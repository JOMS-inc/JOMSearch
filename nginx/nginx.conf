# Terminates TLS for jomsearch.dk and reverse-proxies to the Go app.
# The Let's Encrypt cert lives on the server (/etc/letsencrypt) and is mounted read-only.

events { }

http {
    server {
        listen 80;
        server_name jomsearch.dk www.jomsearch.dk;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name jomsearch.dk www.jomsearch.dk;

        ssl_certificate /etc/letsencrypt/live/jomsearch.dk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jomsearch.dk/privkey.pem;

        location / {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
