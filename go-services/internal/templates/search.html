{{define "title"}}{{end}}

{{define "body"}}
<div>
  <input id="search-input" placeholder="Search..." value="{{.Query}}"/>
  <button id="search-button" onclick="makeSearchRequest()">Search</button>
</div>

<div id="results">
  {{range $i, $r := .SearchResults}}
  <div>
      {{/* Goes through /go so result clicks can be counted (see api/click.go). */}}
      <h2><a class="search-result-title" href="/go?url={{$r.URL}}&rank={{inc $i}}">{{$r.Title}}</a></h2>
      <p class="search-result-description">{{$r.Description}}</p>
  </div>
  {{end}}
</div>

<script>
  let searchInput;

  document.addEventListener('DOMContentLoaded', () => {
    searchInput = document.getElementById("search-input");
    searchInput.focus();
    searchInput.addEventListener('keypress', (event) => {
        if (event.key === 'Enter') {
          makeSearchRequest();
        }
    });
  });

  function makeSearchRequest() {
    const query = searchInput.value;
    const url = new URL(window.location.href);
    url.searchParams.set('q', query);
    window.location.href = url.toString();
  }
</script>
{{end}}
