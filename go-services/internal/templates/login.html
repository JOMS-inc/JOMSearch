{{define "title"}}Sign In{{end}}

{{define "body"}}
<h2>Log In</h2>
{{if .Error}}<div class="error"><strong>Error:</strong> {{.Error}}</div>{{end}}
<form action="/api/login" method="POST">
  <dl>
    <dt><label for="username">Username:</label>
    <dd><input type="text" id="username" name="username" size="30" value="{{.Username}}">
    <dt><label for="password">Password:</label>
    <dd><input type="password" id="password" name="password" size="30">
  </dl>
  <div class="actions">
    <input type="submit" id="login-button" value="Log In">
  </div>
</form>
{{end}}
