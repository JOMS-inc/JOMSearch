# Production setup. The image is built and pushed to GHCR by the CD workflow.
# The database is managed PostgreSQL on Neon; its URL is DATABASE_URL in
# .env, which lives on the server only, never in the image.
# nginx terminates TLS for jomsearch.dk; the app is also reachable directly on :8080.
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# The crawler is a one-shot job, not started by `up` (it is in a profile).
# Run it from cron on the server, e.g. every night at 03:00:
#   0 3 * * * cd ~/JOMSearch && docker compose -f docker-compose.prod.yml run --rm crawler

services:
  app:
    image: ghcr.io/joms-inc/jomsearch:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SEARCH_LOG: /logs/searches.log
    volumes:
      - ./logs:/logs

  # Reads the search log and adds Wikipedia pages for what users search for.
  crawler:
    image: ghcr.io/joms-inc/jomsearch:latest
    profiles: ["crawler"]
    command: ["./crawler"]
    env_file:
      - .env
    environment:
      SEARCH_LOG: /logs/searches.log
    volumes:
      - ./logs:/logs:ro

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # live/ holds symlinks into archive/, so both must be mounted.
      - /etc/letsencrypt/live/jomsearch.dk:/etc/letsencrypt/live/jomsearch.dk:ro
      - /etc/letsencrypt/archive/jomsearch.dk:/etc/letsencrypt/archive/jomsearch.dk:ro
    depends_on:
      - app
