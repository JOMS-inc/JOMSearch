# Production setup. The image is built and pushed to GHCR by the CD workflow.
# The database is managed PostgreSQL on Neon; its URL is DATABASE_URL in
# .env, which lives on the server only, never in the image.
# nginx terminates TLS for jomsearch.dk; the app is also reachable directly on :8080.
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# The crawler is a one-shot job, not started by `up` (it is in a profile).
# Run it from cron on the server, e.g. every night at 03:00:
#   0 3 * * * cd ~/JOMSearch && docker compose -f docker-compose.prod.yml run --rm crawler

services:
  app:
    image: ghcr.io/joms-inc/jomsearch:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SEARCH_LOG: /logs/searches.log
    volumes:
      - ./logs:/logs

  # Reads the search log and adds Wikipedia pages for what users search for.
  crawler:
    image: ghcr.io/joms-inc/jomsearch:latest
    profiles: ["crawler"]
    command: ["./crawler"]
    env_file:
      - .env
    environment:
      SEARCH_LOG: /logs/searches.log
    volumes:
      - ./logs:/logs:ro

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # live/ holds symlinks into archive/, so both must be mounted.
      - /etc/letsencrypt/live/jomsearch.dk:/etc/letsencrypt/live/jomsearch.dk:ro
      - /etc/letsencrypt/archive/jomsearch.dk:/etc/letsencrypt/archive/jomsearch.dk:ro
    depends_on:
      - app

  # Monitoring (see monitoring.md). Prometheus scrapes app:2112/metrics; that
  # port and Prometheus itself are only reachable on the Docker network.
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Keep data long enough to show the semester's graphs at the exam.
      - --storage.tsdb.retention.time=120d
      # ...but never more than 1 GB of disk, whichever limit is hit first.
      - --storage.tsdb.retention.size=1GB
    # The VM has ~900 MB RAM. If Prometheus or Grafana grows past its limit,
    # Docker restarts that container instead of the kernel killing the app.
    mem_limit: 256m
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - app

  # Served by nginx at https://jomsearch.dk/grafana/, behind Grafana's login.
  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://jomsearch.dk/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Grafana downloads extra plugins on every start by default; we only
      # need the built-in Prometheus datasource, so skip it to save memory.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    mem_limit: 256m
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
