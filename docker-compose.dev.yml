# Development setup with hot reloading.
# Usage: docker compose -f docker-compose.dev.yml up --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/jomsearch?sslmode=disable
      SEARCH_LOG: /logs/searches.log
    volumes:
      - ./go-services:/app
      - ./logs:/logs
      - go-mod-cache:/go/pkg/mod
    depends_on:
      db:
        condition: service_healthy

  # Local PostgreSQL. Production uses Neon instead (see database.md).
  # Also reachable from the host on :5432, e.g. for `go test` with
  # TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jomsearch
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Monitoring, same as production but with ports open for local testing:
  # Prometheus http://localhost:9090, Grafana http://localhost:3000 (admin/admin).
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 256m
    depends_on:
      - app

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    mem_limit: 256m
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  go-mod-cache:
  pg-data:
