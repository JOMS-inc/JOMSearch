# Continuous integration: on every pull request (and push to develop),
# check that the Go code is formatted, passes linting, builds, passes tests,
# that the Dockerfiles pass hadolint, that the production Docker image still
# builds, and that the Playwright end-to-end tests pass against the app running
# on the runner. Nothing is deployed.

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-services
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-services/go.mod
          cache-dependency-path: go-services/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: go-services

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Lint the Dockerfiles for common mistakes and bad practices
  # (unpinned versions, missing flags, shell pitfalls via ShellCheck).
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint production Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Lint development Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile.dev

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  # End-to-end tests: start the real app on the runner with a freshly seeded
  # test database, then drive it with Playwright in a headless Chromium.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-services/go.mod
          cache-dependency-path: go-services/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Start the app on a seeded test database
        working-directory: go-services
        run: |
          go run ./cmd/testdb "$RUNNER_TEMP/e2e.db"
          go build -o "$RUNNER_TEMP/server" ./cmd/search-api
          # Background process: it keeps running for the rest of the job.
          DB_PATH="$RUNNER_TEMP/e2e.db" nohup "$RUNNER_TEMP/server" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 1
          done
          echo "App did not start:"; cat "$RUNNER_TEMP/server.log"; exit 1

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          # --ignore-scripts: dependencies may not run install scripts (supply-chain safety).
          npm ci --ignore-scripts
          npm run install-browser

      - name: Run E2E tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
