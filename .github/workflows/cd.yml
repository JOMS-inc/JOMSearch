# Continuous delivery: on every push to main, build the production image,
# push it to GitHub Container Registry and redeploy it on the server,
# then smoke test the live site to confirm the deploy actually came up and
# run the read-only Playwright E2E tests against it.
#
# Required repository secrets:
#   SSH_HOST - IP or hostname of the server
#   SSH_USER - user to log in as (must be allowed to run docker)
#   SSH_KEY  - private SSH key for that user

name: CD

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/joms-inc/jomsearch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy compose file and nginx config to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: docker-compose.prod.yml,nginx/nginx.conf
          target: ~/JOMSearch

      - name: Pull new image and restart
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/JOMSearch
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

  # Smoke test: a quick sanity check that the live site responds after deploy.
  # Goes through https://jomsearch.dk so it covers DNS, TLS, nginx, the app and the DB.
  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://jomsearch.dk
    steps:
      - name: Smoke test with cURL
        run: |
          # `docker compose up -d` returns before the app is listening, so wait for /health first.
          for i in $(seq 1 12); do
            body=$(curl -s --max-time 10 "$BASE_URL/health" || true)
            if [ "$body" = "ok" ]; then
              echo "/health is up (attempt $i)"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "/health did not return 'ok' within 60s (last body: '$body')"
              exit 1
            fi
            sleep 5
          done

          failed=0
          for path in "/" "/about" "/static/style.css" "/api/search?q=test"; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE_URL$path")
            if [ "$status" = "200" ]; then
              echo "OK   $status $path"
            else
              echo "FAIL $status $path"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "Smoke test failed."
            exit 1
          fi
          echo "Smoke test passed."

  # Read-only E2E tests (tagged @readonly) against the live site. Tests that
  # create users only run in CI, so production doesn't fill up with test data.
  e2e-prod:
    needs: smoke-test
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://jomsearch.dk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          # --ignore-scripts: dependencies may not run install scripts (supply-chain safety).
          npm ci --ignore-scripts
          npm run install-browser

      - name: Run read-only E2E tests against production
        working-directory: e2e
        run: npm run test:readonly

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-prod
          path: e2e/playwright-report/
          retention-days: 7
